name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  licenses:
    # Every crate in the release binaries has a licence listed in about.toml; a new one fails here, not at release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate about.hbs -o /dev/null

  install-sh:
    # install.sh against shims, without network: the token never in an argv, and the download fallbacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install.sh
      - run: sh tests/install/token_not_in_argv.sh
      - run: sh tests/install/install_sh_paths.sh

  fuzz-crate:
    # The fuzz crate is isolated from the main one; make sure it still compiles against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets

  kafka:
    # PCE Kafka mode against the test broker: the producer and consumer-group tests, then the FlowPilot-only
    # end-to-end scenario (the FlowLink differential is local only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: tests/kafka/broker.sh up host
      - run: cargo test --locked --test kafka_producer --test kafka_group
        env:
          FLOWPILOT_TEST_KAFKA: localhost:9092
          FLOWPILOT_TEST_KAFKA_SASL: localhost:9093
          FLOWPILOT_TEST_KAFKA_TLS: localhost:9094
          SSL_CERT_FILE: target/kafka-certs/ca.pem
      - run: tests/kafka/broker.sh down
      - run: tests/e2e/run.sh kafka-pilot
