name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  install-sh:
    # install.sh against shims, without network: the token never in an argv, and the download fallbacks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: sh tests/install/token_not_in_argv.sh
      - run: sh tests/install/install_sh_paths.sh

  fuzz-crate:
    # The fuzz crate is isolated from the main one; make sure it still compiles against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets
